# Spectrum source for the media card. cava reads the Pipewire output monitor,
# runs the FFT, and prints one line of bar values per frame; the card only
# parses and draws them.
[general]
mode = normal
framerate = 60
bars = 32
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
noise_reduction = 45
